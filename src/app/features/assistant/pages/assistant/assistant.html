<section class="assistant" [class.sidebar-open]="isSidebarOpen">

    <app-chat-history

        [chats]="chats"

        [selectedChatId]="selectedChatId"

        (newChat)="createChat()"

        (openChat)="openChat($event)"

        (deleteChat)="removeChat($event)">

    </app-chat-history>

    <div class="chat-area">

        <app-chat-header (toggleSidebar)="isSidebarOpen = !isSidebarOpen"></app-chat-header>

        @if (messages.length === 0) {
            <app-suggestion-chips (selected)="send($event)"></app-suggestion-chips>
        }

        <app-message-list

            [messages]="messages"

            [loading]="loading">

        </app-message-list>

        <app-chat-input

            (sendMessage)="send($event)">

        </app-chat-input>

    </div>

</section>
