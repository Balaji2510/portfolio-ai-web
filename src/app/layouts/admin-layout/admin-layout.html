<div class="admin-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed()">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-layer-group"></i>
                <span>Portfolio<b>AI</b> Admin</span>
            </div>
            <button class="toggle-btn" (click)="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
                <i class="fas fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>
            
            <div class="nav-section-title">Content Management</div>

            <a routerLink="/admin/projects" routerLinkActive="active" class="nav-item">
                <i class="fas fa-project-diagram"></i>
                <span>Projects</span>
            </a>
            
            <a routerLink="/admin/skills" routerLinkActive="active" class="nav-item">
                <i class="fas fa-tools"></i>
                <span>Skills</span>
            </a>

            <a routerLink="/admin/experience" routerLinkActive="active" class="nav-item">
                <i class="fas fa-briefcase"></i>
                <span>Experience</span>
            </a>

            <a routerLink="/admin/education" routerLinkActive="active" class="nav-item">
                <i class="fas fa-graduation-cap"></i>
                <span>Education</span>
            </a>

            <a routerLink="/admin/blogs" routerLinkActive="active" class="nav-item">
                <i class="fas fa-blog"></i>
                <span>Blogs</span>
            </a>

            <a routerLink="/admin/certificates" routerLinkActive="active" class="nav-item">
                <i class="fas fa-certificate"></i>
                <span>Certificates</span>
            </a>

            <a routerLink="/admin/statistics" routerLinkActive="active" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistics</span>
            </a>

            <div class="nav-section-title">Communications</div>

            <a routerLink="/admin/messages" routerLinkActive="active" class="nav-item">
                <i class="fas fa-envelope"></i>
                <span>Messages</span>
            </a>

            <div class="nav-section-title">System</div>

            <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>

            <a routerLink="/admin/settings" routerLinkActive="active" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Site Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a routerLink="/" class="nav-item return-btn">
                <i class="fas fa-external-link-alt"></i>
                <span>View Live Site</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
        
        <!-- Topbar -->
        <header class="admin-topbar">
            <div class="topbar-left">
                <!-- Mobile toggle -->
                <button class="mobile-toggle" (click)="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="page-title">Admin Portal</h2>
            </div>
            
            <div class="topbar-right">
                <div class="admin-profile">
                    <div class="avatar">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div class="info">
                        <span class="name">Balaji P</span>
                        <span class="role">Administrator</span>
                    </div>
                </div>
                <button class="logout-btn" (click)="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="admin-content-inner">
            <router-outlet></router-outlet>
        </main>

    </div>

</div>
